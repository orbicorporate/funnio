<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Funnio</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <!-- Sem essas tags o iOS não trata o app como "instalado de verdade" ao abrir da tela
       inicial, e usa o comportamento padrão (splash branco, barra de status clara). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Funnio" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    /* Reset global: sem isso, padding/borda de campos com width:100% "vazam" pra
       fora da caixa em qualquer tela que carregue antes do CRM principal (login,
       escolher funil etc.) */
    * { box-sizing: border-box; }
    /* Fundo escuro já no HTML puro, antes do React montar - evita o "flash" branco
       na tela de login enquanto o JS carrega, especialmente ao abrir como app instalado. */
    html, body { background: #08080a; margin: 0; }
    /* Remove o zoom automático ao tocar duas vezes rápido em qualquer lugar da tela
       (gesto padrão do navegador), sem desabilitar o pinça-pra-zoom manual. */
    html, body { touch-action: manipulation; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
