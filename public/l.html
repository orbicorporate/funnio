<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato de lead - Funnio</title>

  <!-- Capa personalizada que aparece na prévia do WhatsApp -->
  <meta property="og:title" content="Contato de lead" />
  <meta property="og:description" content="Toque para abrir" />
  <meta property="og:image" content="https://funnio.vercel.app/lead-capa.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://funnio.vercel.app/lead-capa.jpg" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #0f0f14;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 360px; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 20px;
      border: 3px solid rgba(163,230,53,0.25);
      border-top-color: #a3e635;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 15px; color: #c4c4cc; margin: 0 0 18px; }
    a.fallback {
      display: inline-block;
      color: #14141a;
      background: #a3e635;
      font-weight: 800;
      text-decoration: none;
      font-size: 14px;
      padding: 12px 22px;
      border-radius: 12px;
    }
  </style>

  <script>
    (function () {
      // "t" = telefone (dígitos) pra abrir o WhatsApp do lead - link bem mais curto do que
      // mandar a URL inteira do WhatsApp como parâmetro. Sem "t", cai no próprio Funnio.
      var params = new URLSearchParams(window.location.search);
      var t = params.get("t");
      var dest = t ? "https://wa.me/" + t : "https://funnio.vercel.app";
      // O WhatsApp não executa esse script ao gerar a prévia do link (só lê os metadados
      // acima) - o redirecionamento só acontece quando a pessoa realmente toca e abre a página.
      window.location.replace(dest);
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <p>Abrindo...</p>
    <a class="fallback" id="fallback" href="https://funnio.vercel.app">Toque aqui se não abrir sozinho</a>
  </div>
  <script>
    (function () {
      var t = new URLSearchParams(window.location.search).get("t");
      document.getElementById("fallback").href = t ? "https://wa.me/" + t : "https://funnio.vercel.app";
    })();
  </script>
</body>
</html>
